[project]
name = "resumer-qa"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "pymupdf>=2.1",
    "numpy>=2.4.6",
    "langchain-core>=1.7.4",
    "langchain-huggingface>=1.2.3",
    "huggingface-hub>=1.33.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "asyncpg>=0.32.0",
    "pyjwt>=2.15.1",
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "alembic>=1.20.1",
    "python-multipart>=0.0.33",
    "qdrant-client>=1.20.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "aiosqlite>=0.22.1",
]
